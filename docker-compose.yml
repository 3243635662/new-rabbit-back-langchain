services:
  # ────────── Redis Stack（含布隆过滤器） ──────────
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    restart: unless-stopped
    command: redis-stack-server --protected-mode no --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ────────── PostgreSQL (LangGraph Checkpoint) ──────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGGRAPH_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LANGGRAPH_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${LANGGRAPH_POSTGRES_DATABASE:-langgraph}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGGRAPH_POSTGRES_USER:-postgres} -d ${LANGGRAPH_POSTGRES_DATABASE:-langgraph}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────── ChromaDB (向量检索) ──────────
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - app-network

volumes:
  redis-data:
  postgres-data:
  chroma-data:

networks:
  app-network:
    driver: bridge
